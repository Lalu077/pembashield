<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PembaShield v2.1 - Na Logo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1020;color:white;padding:15px;font-family:sans-serif}
.container{max-width:500px;margin:0 auto}
.header{text-align:center;padding:20px 0}
.logo-img{width:120px;height:120px;border-radius:50%;border:4px solid #00d2ff;box-shadow:0 0 25px rgba(0,210,255,0.6);object-fit:cover;margin-bottom:10px}
.lang-switch{display:flex;justify-content:center;gap:10px;margin:15px 0}
.lang-btn{padding:8px 18px;border-radius:20px;border:1px solid #00d2ff;background:transparent;color:white;cursor:pointer}
.lang-btn.active{background:#2563eb;color:white;font-weight:bold}
.card{background:#111a30;border:1px solid #1e293b;border-radius:15px;padding:20px;margin-top:10px}
textarea{width:100%;background:#0a1020;border:1px solid #1e293b;color:white;padding:12px;border-radius:10px;height:100px}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#2563eb,#00d2ff);border:none;border-radius:10px;color:white;font-weight:bold;margin-top:12px;cursor:pointer;font-size:16px}
.ex-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:6px 12px;border-radius:20px;margin:5px;font-size:12px;cursor:pointer}
.result{margin-top:15px;display:none;padding:15px;border-radius:10px;text-align:center}
.safe{background:#052e16;border:1px solid #15803d}
.danger{background:#450a0a;border:1px solid #dc2626}
h1{font-size:28px;background:linear-gradient(90deg,#00d2ff,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<div class="container">
<div class="header">
<img src="IMG-20260919-WA2017.jpg" class="logo-img">
<h1>PembaShield</h1>
<p style="color:#94a3b8;font-size:14px">AI Scam Detector kwa Wazanzibari</p>
<div class="lang-switch">
<button class="lang-btn active" onclick="setLang('sw')">🇹🇿 SW</button>
<button class="lang-btn" onclick="setLang('en')">🇺🇸 EN</button>
</div>
</div>
<div class="card">
<textarea id="msg" placeholder="Bandika ujumbe wa kutatia hapa..."></textarea>
<div style="margin-top:10px">
<button class="ex-btn" onclick="setEx('Ndugu umeshinda 500k Tigo Pesa tuma 2000 uchukue')">Tigo 500k</button>
<button class="ex-btn" onclick="setEx('Mambo vipi?')">Salama</button>
<button class="ex-btn" onclick="setEx('Lipa 2000 upate 500k - Kulipia kidogo ili upate nyingi')">Jaribio 10</button>
</div>
<button class="btn" onclick="check()">🛡️ CHUNGUZA UJUMBE</button>
<div id="res" class="result"></div>
</div>
</div>
<script>
let lang='sw';
function setLang(l){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');}
function setEx(t){document.getElementById('msg').value=t;}
function check(){
let m=document.getElementById('msg').value.toLowerCase();
let r=document.getElementById('res');
r.style.display='block';
if(m.includes('500k')||m.includes('2000')||m.includes('shinda')||m.includes('zawadi')||m.includes('tuma')){
r.className='result danger';r.innerHTML='🚨 <b>HATARI! UTAPELI!</b><br>Usitume pesa! Futa ujumbe!';
}else if(m.trim()==''){r.className='result danger';r.innerHTML='Tafadhali andika ujumbe kwanza';}
else{r.className='result safe';r.innerHTML='✅ <b>SALAMA</b><br>Ujumbe unaonekana salama';}
}
</script>
</body>
</html>
